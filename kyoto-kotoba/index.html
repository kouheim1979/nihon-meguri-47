<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f1d1b"><title>京ことば・察して帖</title>
<style>
:root{--ink:#2b2118;--muted:#75685c;--paper:#fbf6eb;--card:#fffdf7;--line:#e7d9c7;--accent:#6f1d1b;--soft:#f3eadc}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f8f0e2,#fffaf0 38%,#f7efe3);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:0 16px 72px}
header{padding:28px 4px 18px}.eyebrow{font-size:11px;letter-spacing:.17em;color:#9a6b2f;font-weight:800}h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(30px,8vw,50px);margin:4px 0}.sub{margin:0;color:var(--muted);line-height:1.65;font-size:14px}
.hero{background:rgba(255,253,247,.9);border:1px solid var(--line);border-radius:22px;padding:18px}.search{display:flex;gap:8px;margin-top:12px}.search input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;font:inherit}.random{border:0;background:var(--accent);color:white;border-radius:13px;padding:0 14px;font-weight:800}
.title{font-weight:900;margin:21px 2px 9px}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:5px}.chip,.tone,.fav,.copy{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 12px;font:inherit;font-size:12px;font-weight:800;white-space:nowrap}.chip.on{background:var(--ink);color:white}.tones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tone{border-radius:14px}.tone.on{border-color:var(--accent);background:#fff5f2}.bar{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:16px;box-shadow:0 7px 18px rgba(71,47,28,.05)}.meta{display:flex;justify-content:space-between;gap:8px;font-size:11px}.cat{color:var(--accent);font-weight:900}.phrase{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:20px;font-weight:800;line-height:1.65;margin:12px 0}.meaning{background:var(--soft);border-radius:12px;padding:10px 11px;font-size:13px;line-height:1.55}.meaning b{color:var(--accent)}.acts{display:flex;gap:8px;margin-top:12px}.copy{flex:1;border-radius:11px}.fav{width:44px;border-radius:11px;font-size:17px;padding:6px}.notice{margin-top:22px;padding:13px;border-left:4px solid #586b4a;background:#ffffff99;border-radius:8px;font-size:12px;line-height:1.7;color:#5b554d}.empty{text-align:center;padding:42px;color:var(--muted)}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#2d261f;color:white;padding:10px 15px;border-radius:999px;opacity:0;transition:.2s}.toast.on{opacity:1}
</style></head><body><div class="wrap">
<header><div class="eyebrow">KYOTO INDIRECT PHRASE BOOK</div><h1>京ことば・察して帖</h1><p class="sub">直接は言わず、でも意味は伝わる——そんな「京都っぽい」遠回し表現を、場面別に楽しむ文言集。</p></header>
<section class="hero"><strong>どんな場面で使いますか？</strong><div class="search"><input id="q" placeholder="例：ピアノ、駐車、長居、タバコ…"><button class="random" id="random">おまかせ</button></div></section>
<div class="title">場面</div><div class="chips" id="chips"></div>
<div class="title">やんわり度</div><div class="tones"><button class="tone" data-tone="1">🌿 ふんわり</button><button class="tone on" data-tone="2">🍵 京都</button><button class="tone" data-tone="3">🪭 察して</button></div>
<div class="bar"><span id="count"></span><button class="chip" id="favOnly">♡ お気に入りだけ</button></div><main class="grid" id="grid"></main>
<div class="notice">※「京都人は必ずこう話す」という事実集ではなく、京都の婉曲表現イメージを楽しむネタ系文言集です。実際の近隣トラブルや重要なお願いでは、丁寧かつ明確に伝えるのがおすすめです。</div></div><div class="toast" id="toast">コピーしました</div>
<script>
var P=[[1,"ピアノ・楽器",1,"毎日よう練習してはりますね。お上手にならはりましたなぁ。","練習の音が毎日かなり聞こえています。"],[2,"ピアノ・楽器",2,"ピアノ、よう聞こえてきますえ。ほんま熱心どすなぁ。","ピアノの音、結構響いてますよ。"],[3,"ピアノ・楽器",3,"夜までよう練習してはるんですねぇ。うちは早う休みますさかい。","夜の演奏はやめてください。"],[4,"生活音",1,"お元気なお子さんで、毎日楽しそうどすなぁ。","足音や走る音がよく聞こえています。"],[5,"生活音",2,"上からよう賑やかな音がして、こちらまで元気もろてます。","上階の物音がかなり響いています。"],[6,"生活音",3,"夜でもよう分かりますえ、何時ごろお帰りになったか。","夜の足音やドア音がうるさいです。"],[7,"駐車・自転車",1,"お車、ええ場所に停めはりましたなぁ。","そこに停められると少し困ります。"],[8,"駐車・自転車",2,"そこ、よう皆さん通らはる所なんどす。","通行の邪魔なので移動してください。"],[9,"駐車・自転車",3,"今日はここ、通れへん日なんかと思いましたわ。","完全に邪魔です。すぐ移動してください。"],[10,"長居・訪問",1,"もうこんな時間どすか。楽しいと早いもんどすなぁ。","そろそろお開きにしたいです。"],[11,"長居・訪問",2,"明日も朝が早おすんやろ？大変どすなぁ。","そろそろ帰ってください。"],[12,"長居・訪問",3,"お布団、出しときまひょか？","ずいぶん長居ですね。そろそろ帰ってください。"],[13,"タバコ・におい",1,"ええ香りがようこちらまで来ますなぁ。","においがこちらまで流れてきています。"],[14,"タバコ・におい",2,"ベランダ出たら、今日は何を吸うてはるかよう分かりますわ。","タバコの煙がこちらまで来て困っています。"],[15,"タバコ・におい",3,"窓閉めてても分かるいうのは、すごいもんどすなぁ。","においが強すぎます。対策してください。"],[16,"ゴミ・共用部",1,"ゴミの日、いろいろあって難しおすなぁ。","分別や曜日を確認してほしいです。"],[17,"ゴミ・共用部",2,"今日は出す日やったかなぁて、ちょっと迷いましたわ。","今日はそのゴミを出す日ではありません。"],[18,"ゴミ・共用部",3,"この辺だけ曜日が違うんかと思いましたえ。","曜日を守ってください。"],[19,"食事・手土産",1,"お気遣い、ほんまおおきに。よう覚えときます。","今回は結構です。気持ちはありがたいです。"],[20,"食事・手土産",2,"うちにはもったいないような、ええもんどすなぁ。","いただくのは遠慮しておきます。"],[21,"食事・手土産",3,"次からは、ほんまに手ぶらで来ておくれやす。","今後は持ってこなくて大丈夫です。"],[22,"服装・趣味",1,"よう似合う色、見つけはりましたなぁ。","かなり個性的な色ですね。"],[23,"服装・趣味",2,"どこにいてはっても、すぐ分かりますなぁ。","かなり目立っています。"],[24,"服装・趣味",3,"なかなか、うちには真似できしまへんわ。","かなり独特ですね。私は選びません。"],[25,"ペット",1,"元気なワンちゃんどすなぁ。声もよう通ります。","鳴き声がよく聞こえています。"],[26,"ペット",2,"お留守の時も、寂しないようよう鳴いてはりますえ。","留守中もずっと鳴いています。"],[27,"ペット",3,"うちも、ワンちゃんのお留守番時間よう分かるようになりました。","長時間の鳴き声で困っています。"],[28,"洗濯・ベランダ",1,"今日はよう風ありますなぁ。洗濯物、元気に揺れてます。","洗濯物がこちら側にはみ出しています。"],[29,"洗濯・ベランダ",2,"うちのベランダまで、ええ具合に影ができますわ。","洗濯物や布団がこちらにかかっています。"],[30,"洗濯・ベランダ",3,"今日はうちの分まで干してもろたんかと思いました。","こちらのスペースにはみ出さないでください。"],[31,"会話・おしゃべり",1,"ようお話が尽きしまへんなぁ。","ずいぶん長く話していますね。"],[32,"会話・おしゃべり",2,"お話、向こうのお部屋までよう聞こえてますえ。","声が大きいです。"],[33,"会話・おしゃべり",3,"内容まで分かるいうのは、壁が薄いんどすかねぇ。","会話が丸聞こえなので声を落としてください。"],[34,"断りたい時",1,"ありがたいお話どすなぁ。ちょっと考えさせてもらいます。","今のところ乗り気ではありません。"],[35,"断りたい時",2,"またご縁がありましたら、よろしゅうお願いします。","今回はお断りします。"],[36,"断りたい時",3,"うちには、ちょっと立派すぎますわ。","必要ありません／合いません。"]];
var cats=["全部"].concat(Array.from(new Set(P.map(function(x){return x[1]}))));
var state={cat:"全部",tone:2,q:"",favOnly:false};var fav=new Set(JSON.parse(localStorage.getItem("kyoto-favs")||"[]"));
var chips=document.getElementById("chips"),grid=document.getElementById("grid"),count=document.getElementById("count"),toast=document.getElementById("toast");
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function drawChips(){chips.innerHTML=cats.map(function(c){return '<button class="chip '+(state.cat===c?'on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>'}).join("");chips.querySelectorAll("[data-cat]").forEach(function(b){b.onclick=function(){state.cat=b.dataset.cat;drawChips();draw()}})}
function list(){var q=state.q.toLowerCase().trim();return P.filter(function(p){return(state.cat==="全部"||p[1]===state.cat)&&p[2]===state.tone&&(!q||(p[1]+" "+p[3]+" "+p[4]).toLowerCase().includes(q))&&(!state.favOnly||fav.has(p[0]))})}
function draw(){var a=list();count.textContent=a.length+"件の言い回し";grid.innerHTML=a.length?a.map(function(p){return '<article class="card" id="p'+p[0]+'"><div class="meta"><span class="cat">'+esc(p[1])+'</span><span>'+["","ふんわり","京都","察して"][p[2]]+'</span></div><div class="phrase">「'+esc(p[3])+'」</div><div class="meaning"><b>本音：</b>'+esc(p[4])+'</div><div class="acts"><button class="copy" data-copy="'+p[0]+'">文言をコピー</button><button class="fav" data-fav="'+p[0]+'">'+(fav.has(p[0])?"♥":"♡")+'</button></div></article>'}).join(""):'<div class="empty">条件に合う文言がありません。</div>';
grid.querySelectorAll("[data-copy]").forEach(function(b){b.onclick=function(){var p=P.find(function(x){return x[0]===Number(b.dataset.copy)});navigator.clipboard.writeText(p[3]).then(show).catch(function(){var t=document.createElement("textarea");t.value=p[3];document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();show()})}});
grid.querySelectorAll("[data-fav]").forEach(function(b){b.onclick=function(){var id=Number(b.dataset.fav);fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem("kyoto-favs",JSON.stringify(Array.from(fav)));draw()}})}
function show(){toast.classList.add("on");setTimeout(function(){toast.classList.remove("on")},1000)}
document.getElementById("q").oninput=function(e){state.q=e.target.value;draw()};
document.querySelectorAll("[data-tone]").forEach(function(b){b.onclick=function(){document.querySelectorAll("[data-tone]").forEach(function(x){x.classList.remove("on")});b.classList.add("on");state.tone=Number(b.dataset.tone);draw()}});
document.getElementById("favOnly").onclick=function(){state.favOnly=!state.favOnly;this.classList.toggle("on",state.favOnly);draw()};
document.getElementById("random").onclick=function(){var a=P.filter(function(p){return p[2]===state.tone&&(state.cat==="全部"||p[1]===state.cat)});if(!a.length)return;var p=a[Math.floor(Math.random()*a.length)];state.q="";document.getElementById("q").value="";draw();setTimeout(function(){var e=document.getElementById("p"+p[0]);if(e)e.scrollIntoView({behavior:"smooth",block:"center"})},50)};
drawChips();draw();
</script></body></html>
