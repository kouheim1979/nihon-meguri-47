<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f1d1b">
<title>京ことば・察して帖｜200文言クイズ</title>
<style>
:root{--ink:#2b2118;--muted:#75685c;--paper:#fbf6eb;--card:#fffdf7;--line:#e5d7c4;--accent:#6f1d1b;--gold:#9a6b2f;--soft:#f3eadc;--ok:#3d6944;--ng:#9b3c32}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:linear-gradient(#f7eedf,#fffaf1 40%,#f6ede0);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}.wrap{max-width:920px;margin:auto;padding:0 15px 76px}
header{padding:27px 3px 15px}.eyebrow{font-size:11px;letter-spacing:.17em;color:var(--gold);font-weight:900}.headrow{display:flex;align-items:end;justify-content:space-between;gap:12px}h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(29px,7vw,48px);margin:3px 0}.badge{background:var(--accent);color:#fff;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}.sub{margin:0;color:var(--muted);font-size:13px;line-height:1.65}
.tabs{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;background:linear-gradient(#f7eedfdd,#f7eedfdd);backdrop-filter:blur(10px)}button,input{font:inherit}.tab{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font-weight:900;color:var(--muted)}.tab.on{background:var(--ink);color:white;border-color:var(--ink)}
.panel{display:none}.panel.on{display:block}.hero,.box{background:rgba(255,253,247,.93);border:1px solid var(--line);border-radius:21px;padding:16px}.hero strong{font-size:16px}.search{display:flex;gap:8px;margin-top:11px}.search input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:900}.btn.secondary{background:var(--ink)}.btn.light{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.title{font-weight:900;margin:19px 2px 8px}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:5px}.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800;white-space:nowrap}.chip.on{background:var(--ink);color:white}.tones{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tone{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 4px;font-size:11px;font-weight:900}.tone.on{background:#fff1ed;border-color:var(--accent);color:var(--accent)}
.bar{display:flex;align-items:center;justify-content:space-between;margin:17px 2px 9px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr;gap:11px}@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 6px 16px #49331d0b}.meta{display:flex;justify-content:space-between;gap:8px;font-size:11px}.cat{font-weight:900;color:var(--accent)}.phrase{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:19px;line-height:1.65;font-weight:800;margin:10px 0}.meaning{background:var(--soft);border-radius:11px;padding:10px;font-size:13px;line-height:1.55}.meaning b{color:var(--accent)}.acts{display:flex;gap:7px;margin-top:10px}.copy,.fav{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;font-weight:800}.copy{flex:1}.fav{width:44px}
.quizTop{padding:18px}.quizTop h2{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;margin:0 0 6px;font-size:27px}.quizTop p{color:var(--muted);font-size:13px;line-height:1.65;margin:0}.selectors{margin-top:16px}.selectGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.sel{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font-weight:900;font-size:12px}.sel.on{background:var(--accent);color:white;border-color:var(--accent)}.diffGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.start{width:100%;margin-top:15px;padding:14px;font-size:16px}
.quizBox{display:none}.quizBox.on{display:block}.progress{height:7px;border-radius:999px;background:#eadfce;overflow:hidden;margin-bottom:13px}.progress span{display:block;height:100%;background:var(--accent);width:0;transition:.25s}.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.qphrase{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(22px,5vw,31px);font-weight:900;line-height:1.6;margin:18px 2px}.ask{font-size:12px;color:var(--gold);font-weight:900;letter-spacing:.08em}.options{display:grid;gap:9px}.option{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;text-align:left;line-height:1.45;font-weight:700}.option:hover{border-color:#bea886}.option.good{background:#eef7ee;border-color:#7aa27c}.option.bad{background:#fff0ed;border-color:#c97a70}.option:disabled{color:var(--ink);opacity:1}.feedback{display:none;margin-top:13px;border-radius:14px;padding:13px;line-height:1.6;font-size:13px}.feedback.on{display:block}.feedback.good{background:#edf6ed;color:#274b2c}.feedback.bad{background:#fff0ed;color:#74322b}.next{width:100%;margin-top:11px;display:none}.next.on{display:block}.result{text-align:center;padding:22px 12px}.score{font-size:58px;font-family:Georgia,serif;font-weight:800;color:var(--accent)}.rank{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:25px;font-weight:900;margin:4px}.result p{color:var(--muted);line-height:1.65}.resultBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.empty{text-align:center;color:var(--muted);padding:38px}.notice{margin-top:20px;padding:13px;border-left:4px solid #586b4a;background:#ffffff9c;border-radius:8px;font-size:12px;color:#5e564d;line-height:1.7}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2d261f;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.on{opacity:1}
</style></head><body><div class="wrap">
<header><div class="eyebrow">KYOTO INDIRECT PHRASE BOOK</div><div class="headrow"><h1>京ことば・察して帖</h1><span class="badge">200文言</span></div><p class="sub">直接は言わず、でも意味は伝わる——「京都っぽい」遠回し表現を楽しむ文言集＆察して力クイズ。</p></header>
<nav class="tabs"><button class="tab on" data-tab="book">文言集</button><button class="tab" data-tab="quiz">察してクイズ</button></nav>

<section id="book" class="panel on">
<div class="hero"><strong>どんな場面で使いますか？</strong><div class="search"><input id="q" placeholder="例：ピアノ、駐車、長居、タバコ…"><button class="btn" id="random">おまかせ</button></div></div>
<div class="title">場面</div><div class="chips" id="chips"></div>
<div class="title">やんわり度</div><div class="tones"><button class="tone on" data-tone="0">全部</button><button class="tone" data-tone="1">🌿 ふんわり</button><button class="tone" data-tone="2">🍵 京都</button><button class="tone" data-tone="3">🪭 察して</button></div>
<div class="bar"><span id="count"></span><button class="chip" id="favOnly">♡ お気に入りだけ</button></div><main class="grid" id="grid"></main>
</section>

<section id="quiz" class="panel">
<div id="quizStart" class="box quizTop"><h2>察して力クイズ</h2><p>この一言、本音では何と言っている？ 4択からいちばん近い意味を当ててください。</p>
<div class="selectors"><div class="title">問題数</div><div class="selectGrid"><button class="sel on" data-n="10">10問</button><button class="sel" data-n="20">20問</button><button class="sel" data-n="50">50問</button><button class="sel" data-n="200">全200問</button></div>
<div class="title">難しさ</div><div class="diffGrid"><button class="sel on" data-diff="easy">ほどほど</button><button class="sel" data-diff="hard">いけず</button></div>
<button class="btn start" id="startQuiz">クイズを始める</button></div></div>
<div id="quizPlay" class="box quizBox"><div class="progress"><span id="prog"></span></div><div class="qhead"><span id="qnum"></span><span id="qscore"></span></div><div class="ask">この言葉の「本音」は？</div><div class="qphrase" id="qphrase"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="btn next" id="nextQ">次の問題</button></div>
<div id="quizResult" class="box quizBox result"><div class="score" id="finalScore"></div><div class="rank" id="rank"></div><p id="resultText"></p><div class="resultBtns"><button class="btn" id="retryWrong">間違いだけ復習</button><button class="btn secondary" id="retryAll">もう一回</button></div><button class="btn light" style="width:100%;margin-top:8px" id="copyResult">結果をコピー</button></div>
</section>

<div class="notice">※これは「京都人は必ずこう話す」という事実集ではなく、京都の婉曲表現イメージを楽しむネタ系アプリです。実際の近隣トラブルや大切なお願いでは、丁寧かつ明確に伝えるのがおすすめです。</div>
</div><div class="toast" id="toast">コピーしました</div>
<script src="./data.js"></script>
<script>
const P=window.PHRASES||[],cats=["全部",...new Set(P.map(x=>x[1]))],toneName=["","ふんわり","京都","察して"];
const state={cat:"全部",tone:0,q:"",favOnly:false};const fav=new Set(JSON.parse(localStorage.getItem("kyoto-favs")||"[]"));
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function toastMsg(t="コピーしました"){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1100)}
$$("[data-tab]").forEach(b=>b.onclick=()=>{$$("[data-tab]").forEach(x=>x.classList.remove("on"));b.classList.add("on");$$(".panel").forEach(x=>x.classList.remove("on"));$("#"+b.dataset.tab).classList.add("on");window.scrollTo({top:0,behavior:"smooth"})});
function drawChips(){const e=$("#chips");e.innerHTML=cats.map(c=>'<button class="chip '+(state.cat===c?'on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join("");$$("[data-cat]").forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;drawChips();drawBook()})}
function filtered(){const q=state.q.toLowerCase().trim();return P.filter(p=>(state.cat==="全部"||p[1]===state.cat)&&(!state.tone||p[2]===state.tone)&&(!q||(p[1]+" "+p[3]+" "+p[4]).toLowerCase().includes(q))&&(!state.favOnly||fav.has(p[0])))}
function drawBook(){const a=filtered();$("#count").textContent=a.length+" / 200件";$("#grid").innerHTML=a.length?a.map(p=>'<article class="card" id="p'+p[0]+'"><div class="meta"><span class="cat">'+esc(p[1])+'</span><span>'+toneName[p[2]]+'</span></div><div class="phrase">「'+esc(p[3])+'」</div><div class="meaning"><b>本音：</b>'+esc(p[4])+'</div><div class="acts"><button class="copy" data-copy="'+p[0]+'">文言をコピー</button><button class="fav" data-fav="'+p[0]+'">'+(fav.has(p[0])?"♥":"♡")+'</button></div></article>').join(""):'<div class="empty">条件に合う文言がありません。</div>';
$$("[data-copy]").forEach(b=>b.onclick=()=>{const p=P.find(x=>x[0]===+b.dataset.copy);copyText(p[3])});$$("[data-fav]").forEach(b=>b.onclick=()=>{const id=+b.dataset.fav;fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem("kyoto-favs",JSON.stringify([...fav]));drawBook()})}
function copyText(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toastMsg()).catch(()=>fallback(t));else fallback(t)}function fallback(t){const e=document.createElement("textarea");e.value=t;document.body.appendChild(e);e.select();document.execCommand("copy");e.remove();toastMsg()}
$("#q").oninput=e=>{state.q=e.target.value;drawBook()};$$("[data-tone]").forEach(b=>b.onclick=()=>{$$("[data-tone]").forEach(x=>x.classList.remove("on"));b.classList.add("on");state.tone=+b.dataset.tone;drawBook()});$("#favOnly").onclick=function(){state.favOnly=!state.favOnly;this.classList.toggle("on",state.favOnly);drawBook()};
$("#random").onclick=()=>{const a=P.filter(p=>(state.cat==="全部"||p[1]===state.cat)&&(!state.tone||p[2]===state.tone));if(!a.length)return;const p=a[Math.floor(Math.random()*a.length)];state.q="";$("#q").value="";drawBook();setTimeout(()=>$("#p"+p[0])?.scrollIntoView({behavior:"smooth",block:"center"}),50)};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let quizN=10,diff="easy",quiz=[],qi=0,score=0,wrong=[],locked=false;
$$("[data-n]").forEach(b=>b.onclick=()=>{$$("[data-n]").forEach(x=>x.classList.remove("on"));b.classList.add("on");quizN=+b.dataset.n});
$$("[data-diff]").forEach(b=>b.onclick=()=>{$$("[data-diff]").forEach(x=>x.classList.remove("on"));b.classList.add("on");diff=b.dataset.diff});
$("#startQuiz").onclick=()=>startQuiz(shuffle(P).slice(0,quizN));
function startQuiz(items){quiz=items;qi=0;score=0;wrong=[];$("#quizStart").style.display="none";$("#quizResult").classList.remove("on");$("#quizPlay").classList.add("on");showQ()}
function distractors(q){let pool;if(diff==="hard"){const same=P.filter(x=>x[1]===q[1]&&x[0]!==q[0]&&x[4]!==q[4]);const other=P.filter(x=>x[1]!==q[1]&&x[4]!==q[4]);pool=[...shuffle(same).slice(0,1),...shuffle(other)];}else pool=P.filter(x=>x[1]!==q[1]&&x[4]!==q[4]);return shuffle(pool).slice(0,3)}
function showQ(){locked=false;const q=quiz[qi];$("#prog").style.width=(qi/quiz.length*100)+"%";$("#qnum").textContent=(qi+1)+" / "+quiz.length;$("#qscore").textContent="正解 "+score;$("#qphrase").textContent="「"+q[3]+"」";const opts=shuffle([q,...distractors(q)]);$("#options").innerHTML=opts.map(x=>'<button class="option" data-id="'+x[0]+'">'+esc(x[4])+'</button>').join("");$("#feedback").className="feedback";$("#nextQ").classList.remove("on");$$(".option").forEach(b=>b.onclick=()=>answer(+b.dataset.id))}
function answer(id){if(locked)return;locked=true;const q=quiz[qi],ok=id===q[0];if(ok)score++;else wrong.push(q);$$(".option").forEach(b=>{b.disabled=true;if(+b.dataset.id===q[0])b.classList.add("good");else if(+b.dataset.id===id)b.classList.add("bad")});const f=$("#feedback");f.className="feedback on "+(ok?"good":"bad");f.innerHTML=(ok?"<b>正解。</b> ":"<b>惜しい。</b> 正解は「"+esc(q[4])+"」。<br>")+"やんわり度：<b>"+toneName[q[2]]+"</b> ／ 場面：<b>"+esc(q[1])+"</b>";$("#qscore").textContent="正解 "+score;$("#nextQ").textContent=qi===quiz.length-1?"結果を見る":"次の問題";$("#nextQ").classList.add("on")}
$("#nextQ").onclick=()=>{qi++;if(qi<quiz.length)showQ();else finishQuiz()};
function finishQuiz(){ $("#quizPlay").classList.remove("on");$("#quizResult").classList.add("on");const pct=Math.round(score/quiz.length*100);$("#finalScore").textContent=score+" / "+quiz.length;let r=pct===100?"おそろしいほど察してはる":pct>=80?"かなりの察し手":pct>=60?"察しのええ人":pct>=40?"京ことば修業中":"まずはお茶でもどうどす？";$("#rank").textContent=r;$("#resultText").textContent="正解率 "+pct+"％。間違いは "+wrong.length+"問でした。";$("#retryWrong").style.display=wrong.length?"block":"none";const key="kyoto-best-"+quiz.length,best=Math.max(+(localStorage.getItem(key)||0),pct);localStorage.setItem(key,best)}
$("#retryWrong").onclick=()=>{if(wrong.length)startQuiz(shuffle(wrong))};$("#retryAll").onclick=()=>{startQuiz(shuffle(P).slice(0,quizN))};$("#copyResult").onclick=()=>copyText("京ことば・察して帖「察して力クイズ」 "+score+"/"+quiz.length+"問正解。"+$("#rank").textContent);
drawChips();drawBook();
</script></body></html>
