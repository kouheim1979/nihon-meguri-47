name: Verify birthplace quiz
on:
  push:
    branches: [main]
    paths: ['rekishi/**', '.github/workflows/verify-rekishi.yml']
  pull_request:
    branches: [main]
    paths: ['rekishi/**', '.github/workflows/verify-rekishi.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript and data
        run: |
          node --check rekishi/data.js
          node --check rekishi/core.js
          node --check rekishi/app.js
          node --test rekishi/test.cjs
