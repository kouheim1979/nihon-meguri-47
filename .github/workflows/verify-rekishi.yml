name: Verify birthplace quiz
on:
  push:
    branches: [main]
    paths: ['rekishi/**', '.github/workflows/verify-rekishi.yml']
  pull_request:
    branches: [main]
    paths: ['rekishi/**', '.github/workflows/verify-rekishi.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript and data
        run: |
          node --check rekishi/data.js
          node --check rekishi/core.js
          node --check rekishi/app.js
          node --test rekishi/test.cjs
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run gameplay and touch layout regressions
        run: |
          python rekishi/browser_test.py
          python rekishi/layout_test.py
